[pytest]
timeout = 60
testpaths = tests
pythonpath = .
# pytest-asyncio 1.x defaults to strict mode. Without auto, async tests are
# collected but never actually awaited, so the suite goes green without having
# run anything.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning:app.*

markers =
    slow: slower tests that shell out to alembic
