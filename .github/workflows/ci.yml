name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run irrelevant, so stop it
# rather than paying for both and reading the older answer by mistake.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + alembic)
    runs-on: ubuntu-latest

    # Both the version README.md recommends for local dev and the one the
    # Dockerfile/Vercel actually deploy on (backend/.python-version) -- this
    # job used to run only 3.14, so nothing ever actually ran the suite on
    # the interpreter production runs until a deploy did.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    services:
      postgres:
        # 18 specifically. The schema calls uuidv7(), which does not exist
        # before 18, so an older image fails at migration time rather than
        # anywhere informative.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forkast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Two databases, because conftest.py refuses to collect when the test URL
      # and the application URL resolve to the same one -- the suite truncates
      # every mutable table and that guard is what stops it doing so to data
      # somebody cares about.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/forkast
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/forkast_test
      # Not a secret: this database is created and destroyed inside this job.
      JWT_SECRET: ci-only-secret-000000000000000000000000000000
      ENVIRONMENT: dev
      # No key in CI, and none needed: the suite injects a deterministic
      # stand-in through dependency_overrides, so the Groq path is covered
      # without ever reaching the network.
      AI_PROVIDER: fake

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Create the test database
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres forkast_test
          PGPASSWORD=postgres psql -h localhost -U postgres -d forkast \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          PGPASSWORD=postgres psql -h localhost -U postgres -d forkast_test \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'

      - name: Install dependencies
        working-directory: backend
        # requirements-dev.txt pulls in requirements.txt itself (see its own
        # -r line) plus ruff/pytest/coverage, which CI needs and production
        # deliberately does not -- see the Dockerfile, which installs only
        # requirements.txt.
        #
        # Matches the README: a missing wheel must fail loudly rather than drop
        # into a source build that may or may not find a compiler.
        #
        # A block scalar because the bare form ends in ":all:", and the " :"
        # inside it makes YAML read the line as a mapping rather than a command.
        run: |
          pip install -r requirements-dev.txt --only-binary :all:

      - name: Lint
        working-directory: backend
        # ruff is pinned in requirements-dev.txt and installed by the step
        # above, so CI and a laptop cannot disagree about what "clean" means.
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations apply to an empty database
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Models and migrations have not drifted
        working-directory: backend
        run: python -m alembic check

      - name: Tests
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=json

      # Only one cell of the matrix needs to feed the badge; otherwise the
      # badges job below would receive two same-named artifacts and fail to
      # tell them apart.
      - name: Upload coverage summary
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.json
          retention-days: 1

  mobile:
    name: Mobile (tsc + jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Expo SDK 57's floor. Nothing in the repo enforces it at runtime, so
          # CI is where a version below it gets caught.
          node-version: '22.13'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Tests
        working-directory: mobile
        run: npx jest --ci --coverage --coverageReporters=text --coverageReporters=json-summary

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/coverage-summary.json
          retention-days: 1

  badges:
    name: Coverage badges
    needs: [backend, mobile]
    # Only main has anywhere to commit the badge data to, and a fork's PR
    # can't push back to this repo's own branch regardless.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: badge-input/backend

      - uses: actions/download-artifact@v4
        with:
          name: mobile-coverage
          path: badge-input/mobile

      - name: Render badge data
        run: |
          python - <<'PY'
          import json

          def color(pct):
              if pct >= 90:
                  return "brightgreen"
              if pct >= 75:
                  return "green"
              if pct >= 60:
                  return "yellow"
              return "red"

          backend_pct = round(json.load(open("badge-input/backend/coverage.json"))["totals"]["percent_covered"], 1)
          mobile_pct = round(json.load(open("badge-input/mobile/coverage-summary.json"))["total"]["lines"]["pct"], 1)

          import os
          os.makedirs(".github/badges", exist_ok=True)
          for name, pct in (("backend", backend_pct), ("mobile", mobile_pct)):
              with open(f".github/badges/{name}-coverage.json", "w") as f:
                  json.dump(
                      {
                          "schemaVersion": 1,
                          "label": "coverage",
                          "message": f"{pct}%",
                          "color": color(pct),
                      },
                      f,
                  )
          PY

      # shields.io's endpoint badge (referenced from README.md) reads these
      # files straight off raw.githubusercontent.com, so there is no gist,
      # no token and no third-party account to keep working -- only this
      # commit, made with the workflow's own built-in token.
      - name: Commit badge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git diff --cached --quiet && exit 0
          git commit -m "Update coverage badges [skip ci]"
          git push
